device: "cuda"
logging_level: "INFO"

evaluation:
  experiment_name: "narrator_comparison"
  provider: null
  model: null
  temperature: null
  repeat_count: null
  distraction_levels: null
  test_cases: null
  narrator_types: ["baseline", "timeline"]  # Optional: ["baseline"], ["timeline"], Or ["baseline", "timeline"]

scene_describer:
  model: "gpt-4o-2024-08-06"
  provider: "openai"
  temperature: 0.1
  description_type: "narrative_timeline"
  use_pregenerated_description: true
  use_timeline_examples: true
  use_examples: true
  use_clustering: true
  eps: 1.0
  min_samples: 2
  auto_save_descriptions: true
  enable_cache: true
  cache_dir: "cache/scene_describer"

narrator:
  model: "qwen3-235b-a22b-instruct-2507"
  provider: "qwen-dashscope"
  temperature: 0.0  # For thinking mode, use Temperature=0.6
  use_JSON_mode: true
  use_examples: true
  use_self_feedback: true
  max_self_feedback_count: 3
  additional_guidelines: ""
  disable_event_based_planning: false
  type: null  # This will be dynamically set at runtime; null is used as a placeholder to avoid struct mode errors

event_parser:
  model: "qwen3-235b-a22b-instruct-2507"
  provider: "qwen-dashscope"
  temperature: 0.6  # For thinking mode, use Temperature=0.6
  use_JSON_mode: true
  use_examples: true
  use_self_feedback: true
  max_self_feedback_count: 3
  additional_guidelines: ""
  disable_lcps: false

scene_graph:
  boundary_offset: 0.10
  adjacent_threshold: 0.3
  close_threshold: 1.0
  relationship_xy_threshold: 2.0
  relationship_z_threshold: 0.2
  use_obj_positions: true
  use_affordances: false

position_sampler:
  init_temperature: 1.0
  final_temperature: 0.0001
  cooling_rate: 0.9
  cooling_interval: 1
  move_std: 0.5
  k: 1.0
  r: 5.0
  max_iter: 5000
  convergence_threshold: 0.05
  convergence_iteration: 20
  avoidance_coefficient: 5.0
  avoidance_threshold: 0.5
  nearby_threshold: 1.5
  multi_object_thresholds:
    between:
      aligned: 1.0
      orthogonal: 0.5
    aligned with:
      aligned: 1.0
      orthogonal: 0.3
  distance_threshold:
    on the side of: 0.5
    adjacent to: 0.5
    close to: 1.0
  cost_weights:
    directional: 1.0
    distance: 1.0
    multi_object: 1.0
    interaction: 100.0
    avoidance: 10.0
    nearby: 1.0
  collision_check_type: "cylinder"

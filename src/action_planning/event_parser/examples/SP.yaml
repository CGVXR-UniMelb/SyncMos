    bob = get_character("Bob")
    
    # Bob is already sitting on chair_9, so he should maintain that position
    # The system will understand he's reaching from his seated position
    bob_position = get_area_to_sit_on("chair_9")
    
    # The target action is 'pick up' from the available actions
    bob_action = "pick up"
    

name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff, Black and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: false
      - run: uvx ruff==0.17.2 check . --output-format github
      - run: uvx black==26.10.1 --check .
      - run: uv lock --check

  cpu-checks:
    name: CLI and imports (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python: .venv-cpu/bin/python
          - os: windows-latest
            python: .venv-cpu/Scripts/python.exe
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Create CPU environment
        run: uv venv --python ${{ matrix.python-version }} .venv-cpu
      - name: Export locked dependencies without CUDA PyTorch
        run: uv export --locked --no-dev --no-hashes --prune torch --prune torchvision --prune torchaudio --output-file .venv-cpu/requirements.txt
      - name: Install CPU dependencies
        run: uv pip install --python .venv-cpu --no-sources --torch-backend cpu -r .venv-cpu/requirements.txt torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0
      - run: uv pip check --python .venv-cpu
      - name: Compile runtime modules and entrypoints
        shell: bash
        run: ${{ matrix.python }} -m compileall -q src benchmark main.py
      - name: Check entrypoints without model assets or API calls
        shell: bash
        run: |
          ${{ matrix.python }} main.py --help
          ${{ matrix.python }} -m benchmark --help
          ${{ matrix.python }} -m benchmark comparison --help
          ${{ matrix.python }} -m benchmark planning --help
          ${{ matrix.python }} -m benchmark ablation --help
          ${{ matrix.python }} -m benchmark ablation-two --help
          ${{ matrix.python }} -m benchmark summary --help

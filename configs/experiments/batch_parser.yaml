scene_name: "Restaurant"
num_characters: 2
device: "cuda"
framerate: 30
logging_level: "INFO"

scene_describer:
  model: "gpt-4o-2024-08-06"
  provider: "openai"
  temperature: 0.1
  description_type: "narrative"
  use_pregenerated_description: true
  use_examples: true
  use_clustering: true
  eps: 1.0
  min_samples: 2

narrator:
  type: "timeline"
  model: "gpt-4o-2024-08-06"
  provider: "openai"
  temperature: 0.0
  use_JSON_mode: true
  use_examples: true
  use_self_feedback: true
  max_self_feedback_count: 3
  additional_guidelines: ""
  disable_event_based_planning: false

event_parser:
  model: "gpt-4o-2024-08-06"
  provider: "openai"
  temperature: 0.0
  use_JSON_mode: true
  use_examples: true
  use_self_feedback: true
  max_self_feedback_count: 3
  additional_guidelines: ""
  disable_lcps: false
  # Batch parsing mode configuration
  parser_mode: "batch"  # Options: "single" (default), "batch"
  enable_cache: true  # Enable caching to avoid repeated calls
  cache_dir: "cache/event_parser_batch"

state_manager:
  far_threshold: 0.8
  near_threshold: 0.3
  hsi_matching_start_distance: 0.3
  hsi_matching_threshold: 0.3
  hsi_matching_done_root_distance: 0.15
  hsi_transition_done_delay: 20
  hsi_grid_path_len_threshold: 6
  height_threshold: 0.95
  hhi_matching_start_distance: 2.0
  hhi_matching_threshold: 1.0

path_planner:
  non_moving_cost: 0.3
  min_planning_timesteps: 3
  max_planning_timesteps: 100
  oracle_timesteps: 20
  collision_soft_threshold: 1.0
  collision_hard_threshold: 1.5
  soft_collision_cost: 0
  hard_collision_cost: 10
  collision_cost_scaler: 20
  occupied_neighbor_radius: 1  # Radius occupied by surrounding cells (number of cells)
  deadlock_threshold: 90
  movement_threshold: 0.05
  deadlock_avoidance_duration: 60
  deadlock_collision_multiplier: 0.1

scene_graph:
  boundary_offset: 0.10
  adjacent_threshold: 0.3
  close_threshold: 1.0
  relationship_xy_threshold: 2.0
  relationship_z_threshold: 0.2
  use_obj_positions: true
  use_affordances: false

position_sampler:
  init_temperature: 1.0
  final_temperature: 0.0001
  cooling_rate: 0.9
  cooling_interval: 1
  move_std: 0.5
  k: 1.0
  r: 5.0
  max_iter: 5000
  convergence_threshold: 0.05
  convergence_iteration: 20
  avoidance_coefficient: 5.0
  avoidance_threshold: 0.5
  nearby_threshold: 1.5
  multi_object_thresholds:
    between:
      aligned: 1.0
      orthogonal: 0.5
    aligned with:
      aligned: 1.0
      orthogonal: 0.3
  distance_threshold:
    on the side of: 0.5
    adjacent to: 0.5
    close to: 1.0
  cost_weights:
    directional: 1.0
    distance: 1.0
    multi_object: 1.0
    interaction: 100.0
    avoidance: 10.0
    nearby: 1.0
  collision_check_type: "cylinder"

motion_matching:
  motion_update_frequency: 42
  halflife_transl: 0.05
  halflife_global_orient: 0.05
  halflife_pose: 0.3
  halflife_walk: 0.5
  halflife_hhi: 0.5
  halflife_hsi: 0.2
  halflife_idle: 0.3
  future_offsets: [0.3, 0.6, 1.0]
  pose_feature_dim: 166

motion_db:
  recreate_db: false

misc:
  minimum_distance: 0.6
  root_height_offset: 0.2

characters:
  - name: "waiter"
    gender: "male"
    initial_position: [3.5, 2.0]
    initial_facing_direction: [0.0, 1.0]
    motion_db: "base"
  - name: "customer"
    gender: "female"
    initial_position: [2.0, 5.0]
    initial_facing_direction: [1.0, 0.0]
    motion_db: "base"


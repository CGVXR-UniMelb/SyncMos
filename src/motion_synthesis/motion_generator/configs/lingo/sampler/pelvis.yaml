pelvis:
  _target_: src.motion_synthesis.lingo_external.create_external_sampler
  checkout: ${oc.env:SYNCMOS_LINGO_CHECKOUT,null}
  device: ${device}
  mask_ind: ${guidance.pelvis.mask_ind}
  emb_f: ${guidance.pelvis.emb_f}
  batch_size: ${batch_size}
  channel: ${times:${dataset.nb_joints},3}
